<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sobre Mim | Bianca Carolina</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4f1, #e9ddff);
            min-height: 100vh;
            color: #4a3045;
        }

        header {
            background: linear-gradient(135deg, #c85a8e, #8e5ab7);
            color: white;
            text-align: center;
            padding: 35px 20px;
            border-radius: 0 0 35px 35px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        main {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            margin-bottom: 22px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(120, 70, 120, 0.15);
        }

        .card h2 {
            color: #a54882;
            margin-bottom: 15px;
            font-size: 23px;
        }

        .card p {
            line-height: 1.7;
            font-size: 16px;
        }

        .detalhes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detalhe {
            background: #fff0f7;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
        }

        .detalhe h3 {
            color: #9b68a9;
            margin-bottom: 8px;
        }

        .detalhe p {
            font-size: 14px;
        }

        .voltar {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #d86fa2, #9b68c4);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 25px;
            transition: 0.3s;
        }

        .voltar:hover {
            transform: scale(1.03);
        }
